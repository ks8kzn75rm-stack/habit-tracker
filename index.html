<!doctype html>
<html lang="en-GB" data-phase="morning">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Daybreak</title>
    <meta name="description" content="A kind, private habit tracker that works offline." />

    <!-- Installable, full-screen app on iPhone (Safari: Share → Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daybreak" />
    <meta name="application-name" content="Daybreak" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#8f2e10" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />

    <script src="js/boot.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="status-cap" aria-hidden="true"></div>

    <div id="update-banner" class="update-banner" role="status" hidden>
      <span class="update-text">✨ A fresh version of Daybreak is ready.</span>
      <button type="button" class="update-button">Tap to refresh</button>
    </div>

    <main id="view" class="app-view" tabindex="-1">
      <div class="splash" aria-label="Loading">
        <img class="splash-icon" src="icons/icon-192.png" alt="" width="72" height="72" />
      </div>
    </main>

    <nav class="tabbar" aria-label="Main">
      <a class="tab" href="#/today" data-tab="today">
        <svg class="icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M5.6 9.6l1.4 1.4M18.4 9.6L17 11M3 17h2M19 17h2M7 17a5 5 0 0 1 10 0M2 21h20" /></svg>
        <span>Today</span>
      </a>
      <a class="tab" href="#/review" data-tab="review">
        <svg class="icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8" /></svg>
        <span>Review</span>
      </a>
      <a class="tab" href="#/foundations" data-tab="foundations">
        <svg class="icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M15.5 8.5l-2 5-5 2 2-5z" /></svg>
        <span>Foundations</span>
      </a>
      <a class="tab" href="#/settings" data-tab="settings">
        <svg class="icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div id="boot-fallback" class="boot-fallback" role="alert" hidden>
      <div class="boot-card">
        <p class="boot-title">Daybreak is taking longer than usual to start.</p>
        <p class="boot-text">Reloading usually fixes it. If not, “Repair” clears the offline copy of the app and downloads it again. Your habits and history are kept.</p>
        <button type="button" class="btn btn-primary btn-block" data-action="reload">Reload</button>
        <button type="button" class="btn btn-block" data-action="repair">Repair &amp; reload</button>
      </div>
    </div>

    <noscript><p class="noscript">Daybreak needs JavaScript to run.</p></noscript>
  </body>
</html>
